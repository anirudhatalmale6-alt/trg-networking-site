; TRG Networking - per-site PHP limits.
;
; The server-wide php.ini (C:\PHP\php.ini) ships PHP's defaults: a 2 MB upload
; limit and an 8 MB POST body. That is smaller than the book, smaller than a
; photograph off a modern phone, and smaller than most plugin zips, so the
; WordPress admin refused files it should have accepted.
;
; upload_max_filesize and post_max_size are PHP_INI_PERDIR settings, which
; means a .user.ini beside the site can raise them without editing the server's
; php.ini or restarting anything. web.config already returns 403 for this
; filename, so it is not readable over HTTP.
;
; post_max_size must stay comfortably ABOVE upload_max_filesize: the POST body
; carries the file plus the form fields around it, and if it is the smaller of
; the two PHP discards the whole request and the admin screen simply comes back
; blank with nothing uploaded.

upload_max_filesize = 32M
post_max_size = 40M

; A 300-page PDF and its metadata need more headroom than the 30 seconds and
; 128 MB the defaults allow, and an upload that dies half way leaves a partial
; file rather than an error anyone can read.
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
